# ============================================================
# Awesome Video Prompts (Next.js) — Cloudflare Workers config
# 部署目标: Cloudflare Workers (via OpenNext)
# 数据存储: D1 (prompts-db) + R2 (媒体)
# ============================================================

name = "awesome-video-prompts-nextjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# ============================================================
# D1: prompts 元数据存储
# database_id 从 .dev.vars 的 D1_DATABASE_ID 读；本文件保留生产值
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "awesomevideoprompts-db"
database_id = "486ccac9-d364-4db4-b911-d4a420bcbc6c"

# ============================================================
# R2: 视频/封面图托管
# 通过自定义域 static.awesomevideoprompts.com 公开访问
# 注意：自定义域 static.awesomevideoprompts.com 绑定在 awesome-video-prompts-static
#       （历史素材都在此 bucket），发布必须写这个 bucket，否则公开 URL 404。
#       media bucket（awesome-video-prompts-media）是 2026-06 误建的旧绑定，
#       已在 2026-08-04 把其中对象迁移至 static bucket。
# ============================================================
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "awesome-video-prompts-static"

# ============================================================
# Workers Cache（2026-09-08 C1）
#
# ⚠️ 当前状态：**关闭**（2026-09-08 当天上线后按用户要求回退，观察 24h 成本）
#
# 为什么当初要开：
#   - Worker 自己生成的响应**不会**进入 zone 缓存；CF 文档明确 "No zone configuration
#     for caching applies to Workers Caching. Cache Rules ... have no effect"。
#   - 所以 HTML 想被边缘缓存，只能开 Workers Cache（wrangler ≥ 4.69.0）。
#
# 为什么先关（成本权衡，实测数据）：
#   - 计费口径变化：开启后「静态资源请求」从免费无限变为按请求计费
#     （pricing 脚注 4：requests served from the Worker's cache are billed ... includes static assets），
#     本站单页引用 ~14 个静态资源。
#   - 而收益侧：D1 当前 ~1.03B 行/月，仅占 25B 免费额度 4% → 已经 $0；
#     CPU 181M ms/月（30M 免费）→ 约 $3/月超额，缓存命中可省 $2-3/月。
#   - 结论：净收益为正但存在请求数不确定性，先关掉观察 24h 再定。
#
# 重新开启：把下面 enabled 改回 true 并重新部署即可（wrapper 与路由侧的缓存头已就绪，
#           不需要其他改动；cache key 含 Worker version，部署即冷启动，无陈旧风险）。
# ============================================================
[cache]
enabled = false

# ============================================================
# 环境变量
# 生产环境在 Cloudflare Dashboard 或 wrangler secret 注入
# ============================================================
[vars]
NEXT_PUBLIC_SITE_URL = "https://awesomevideoprompts.com"
NEXT_PUBLIC_R2_PUBLIC_URL = "https://static.awesomevideoprompts.com"
# REVALIDATE_SECRET 必须通过 wrangler secret put revalidate-secret 设置，不写在此文件
# ADMIN_SECRET 也必须通过 wrangler secret put admin-secret 设置（md-editor publish 调用）
# wrangler secret put revalidate-secret --name awesome-video-prompts-nextjs
# wrangler secret put admin-secret --name awesome-video-prompts-nextjs

# ============================================================
# 部署环境（dev / staging / production）
# ============================================================
[env.dev]
name = "awesome-video-prompts-nextjs-dev"
vars = { NEXT_PUBLIC_SITE_URL = "http://localhost:3000" }

[env.staging]
name = "awesome-video-prompts-nextjs-staging"

[env.production]
name = "awesome-video-prompts-nextjs"