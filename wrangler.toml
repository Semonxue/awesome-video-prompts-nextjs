# ============================================================
# Awesome Video Prompts (Next.js) — Cloudflare Workers config
# 部署目标: Cloudflare Workers (via OpenNext)
# 数据存储: D1 (prompts-db) + R2 (媒体)
# ============================================================

name = "awesome-video-prompts-nextjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# ============================================================
# D1: prompts 元数据存储
# database_id 从 .dev.vars 的 D1_DATABASE_ID 读；本文件保留生产值
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "awesomevideoprompts-db"
database_id = "486ccac9-d364-4db4-b911-d4a420bcbc6c"

# ============================================================
# R2: 视频/封面图托管
# 通过自定义域 static.awesomevideoprompts.com 公开访问
# 注意：自定义域 static.awesomevideoprompts.com 绑定在 awesome-video-prompts-static
#       （历史素材都在此 bucket），发布必须写这个 bucket，否则公开 URL 404。
#       media bucket（awesome-video-prompts-media）是 2026-06 误建的旧绑定，
#       已在 2026-08-04 把其中对象迁移至 static bucket。
# ============================================================
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "awesome-video-prompts-static"

# ============================================================
# Workers Cache（2026-09-08 C1 引入，2026-10-15 重新开启）
#
# 为什么开（这是 CPU 超预算的唯一有效解）：
#   - 官方计费规则：**缓存命中（HIT）时 Worker 完全不执行，CPU 计费为零**，
#     仅按标准费率算请求；MISS / BYPASS 才计 CPU。
#   - 本站 CPU 历史实测 181M ms/月 vs 30M 免费额度 → 约 $3/月超额。
#     命中率 60~80% 即可把 CPU 压回 36M~72M ms（接近免费额度内）。
#   - middleware 的 `cloudflare-cdn-cache-control: public, max-age=28800, swr=86400`
#     在此之前一直是空转（响应头在线上确实存在，但没有缓存层消费它）。
#
# ⚠️ 2026-10-15 更正一条已过时的顾虑：
#   旧注释写「开启后静态资源请求从免费无限变为按请求计费」——
#   **这条在当前计费模型下不成立**。官方文档明确：
#     "Requests to static assets are free and unlimited."
#   且实测 `/_next/static/chunks/*` 已是 `cf-cache-status: HIT`（静态资源本就走
#   zone CDN，不经过 Worker 的 HTML 渲染路径）。
#
# 部署注意：cache key 含 Worker version，每次部署即冷启动，无陈旧数据风险。
# 监控：CF Dashboard → 该 Worker → Observability → cache hit rate / CPU
# ============================================================
[cache]
enabled = true

# ============================================================
# 环境变量
# 生产环境在 Cloudflare Dashboard 或 wrangler secret 注入
# ============================================================
[vars]
NEXT_PUBLIC_SITE_URL = "https://awesomevideoprompts.com"
NEXT_PUBLIC_R2_PUBLIC_URL = "https://static.awesomevideoprompts.com"
# REVALIDATE_SECRET 必须通过 wrangler secret put revalidate-secret 设置，不写在此文件
# ADMIN_SECRET 也必须通过 wrangler secret put admin-secret 设置（md-editor publish 调用）
# wrangler secret put revalidate-secret --name awesome-video-prompts-nextjs
# wrangler secret put admin-secret --name awesome-video-prompts-nextjs

# ============================================================
# 部署环境（dev / staging / production）
# ============================================================
[env.dev]
name = "awesome-video-prompts-nextjs-dev"
vars = { NEXT_PUBLIC_SITE_URL = "http://localhost:3000" }

[env.staging]
name = "awesome-video-prompts-nextjs-staging"

[env.production]
name = "awesome-video-prompts-nextjs"

# ============================================================
# 可观测性（Cloudflare Workers Observability）
#
# 2026-10-15 成本优化：原为 head_sampling_rate = 1（全量采样）+ invocation_logs。
# 问题：
#   - 按 ~2.76M 请求/月计，全量 invocation logs 已远超 Workers Paid 的
#     20M events/月余量，且 traces 也全开。
#   - **2026-12-01 起 Workers Logs 改为按 GB 计费**（$0.25/GB 摄入 +
#     $0.10/GB-月存储），CF 估算单条日志均 4.84 KB —— 全量采样下成本约翻倍。
#
# 现在的取舍：
#   - logs 采样 5%：足够排查线上问题，成本降到 1/20。
#   - invocation_logs = false：不再为每个请求写一条完整 invocation 记录。
#     ⚠️ 注意：cache 命中率统计走独立的 Observability 指标面板（hit/miss/update/
#     bypass），不依赖 invocation logs，所以关掉不影响我们观察缓存效果。
#     但这意味着**排查具体某个请求**时不再有逐条日志，故保留 5% head sampling。
#   - traces 关闭：trace 是按 trace event 单独计费的，且全量 trace 对本站
#     （无关键路径调试需求）价值有限。
#
# 需要临时深度排查时，把 head_sampling_rate 临时调回 1，排查完改回 0.05。
# ============================================================
[observability.logs]
enabled = true
head_sampling_rate = 0.05
invocation_logs = false
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 0.05
persist = true