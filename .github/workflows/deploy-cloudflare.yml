name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cloudflare 凭据从 Repository secrets 注入，绝不写入仓库。
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error title=Missing Cloudflare credential::CLOUDFLARE_API_TOKEN is empty. Add it as a GitHub Repository secret."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Missing Cloudflare credential::CLOUDFLARE_ACCOUNT_ID is empty. Add it as a GitHub Repository secret."
            exit 1
          fi

      - name: Build Cloudflare bundle
        run: npm run build:cf

      - name: Deploy to Cloudflare Workers
        # An empty Wrangler environment explicitly selects the top-level config.
        # This keeps the top-level D1/R2 bindings and removes the multi-env warning.
        run: npx wrangler deploy --env=""

      - name: Smoke check /en
        run: curl -fSs https://awesomevideoprompts.com/en > /dev/null
